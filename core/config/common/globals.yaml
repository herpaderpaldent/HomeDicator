globals:
  - id: pager_dots
    type: std::vector<lv_obj_t *>
    restore_value: no
  # LVGL page indices of all non-skip pages in pager order (settings ends up last)
  - id: page_order
    type: std::vector<size_t>
    restore_value: no
  - id: user_is_interacting
    type: bool
    initial_value: "false"
    restore_value: no
  - id: use_24h_clock
    type: bool
    initial_value: "true"
    restore_value: yes
  - id: turn_off_screen_after_value
    type: int
    initial_value: "0"
    restore_value: yes
