globals:
  - id: pager_dots
    type: std::vector<lv_obj_t *>
    restore_value: no
  # LVGL page indices of all non-skip pages in pager order (settings ends up last)
  - id: page_order
    type: std::vector<size_t>
    restore_value: no
  - id: user_is_interacting
    type: bool
    initial_value: "false"
    restore_value: no
  - id: use_24h_clock
    type: bool
    initial_value: "true"
    restore_value: yes
  - id: turn_off_screen_after_value # Mirrors the "Turn off screen after" select (select.yaml), which persists it
    type: int
    # Only validates screen_off_after at compile time; the select publishes the real value at setup.
    initial_value: |-
      []() -> int {
        constexpr std::string_view v = "${screen_off_after}";
        static_assert(v == "Never" || v == "1 min" || v == "5 min" || v == "15 min",
                      "screen_off_after must be one of: Never, 1 min, 5 min, 15 min");
        return v == "1 min" ? 1 : v == "5 min" ? 2 : v == "15 min" ? 3 : 0;
      }()
    restore_value: no
