script:
  - id: update_time
    then:
      - if:
          condition:
            lambda: 'return id(use_24h_clock);'
          then:
            - lvgl.label.update:
                id: lvgl_current_time
                text:
                  format: "%02d:%02d"
                  args: [ 'id(homeassistant_time).now().hour', 'id(homeassistant_time).now().minute' ]
          else:
            - lvgl.label.update:
                id: lvgl_current_time
                text: !lambda |-
                  auto now = id(homeassistant_time).now();
                  int hour = now.hour % 12 == 0 ? 12 : now.hour % 12;
                  auto am_pm = now.hour >= 12 ? "PM" : "AM";
                  static char time_text[10];
                  snprintf(time_text, sizeof(time_text), "%d:%02d %s", hour, now.minute, am_pm);
                  return time_text;

  - id: hide_page_control_elements
    then:
      - lvgl.widget.hide: top_tap_area
      - lvgl.widget.hide: bottom_tap_area
      - lvgl.widget.hide: left_tap_area
      - lvgl.widget.hide: right_tap_area
      - lvgl.widget.hide: bottom_pager

  - id: show_page_control_elements
    then:
      - lvgl.widget.show: top_tap_area
      - lvgl.widget.show: bottom_tap_area
      - lvgl.widget.show: left_tap_area
      - lvgl.widget.show: right_tap_area
      - lvgl.widget.show: bottom_pager

  # Builds the pager from the pages that actually exist (no total_pages needed).
  # Walks the page cycle once with the public LvglComponent API, records the order of
  # non-skip pages, and finishes on the first page after "settings" (first user page).
  - id: init_pager
    then:
      - lambda: |-
          auto *lv = id(settings)->get_parent();
          auto &order = id(page_order);
          order.clear();
          size_t start = lv->get_current_page();
          do {
            lv->show_next_page({}, 0);
            order.push_back(lv->get_current_page());
          } while (lv->get_current_page() != start && order.size() < 64);
          lv->show_next_page({}, 0);  // land on first user page
          for (size_t i = 0; i < order.size(); i++) {
            auto dot = lv_obj_create(id(bottom_pager));
            lv_obj_set_size(dot, 8, 8);
            lv_obj_set_style_radius(dot, 4, LV_PART_MAIN);
            lv_obj_set_style_bg_opa(dot, LV_OPA_COVER, LV_PART_MAIN);
            lv_obj_set_style_border_width(dot, 0, LV_PART_MAIN);
            id(pager_dots).push_back(dot);
          }
          std::string seq;
          for (auto i : order) seq += std::to_string(i) + " ";
          ESP_LOGI("pager", "Pager initialised with %u pages, order: %s, showing page %u",
                   (unsigned) order.size(), seq.c_str(), (unsigned) lv->get_current_page());
      - script.execute: update_pager_dots

  - id: update_pager_dots
    then:
      - lambda: |-
          size_t cur = id(settings)->get_parent()->get_current_page();
          auto &dots = id(pager_dots);
          auto &order = id(page_order);
          for (size_t i = 0; i < dots.size() && i < order.size(); i++) {
            lv_obj_set_style_bg_color(dots[i], order[i] == cur ? lv_color_hex(0xffffff) : lv_color_hex(0x626262), LV_PART_MAIN);
          }

  - id: next_page
    then:
      - lvgl.page.next:
          animation: MOVE_LEFT
          time: ${page_transition_time}
      - script.execute: update_pager_dots

  - id: previous_page
    then:
      - lvgl.page.previous:
          animation: MOVE_RIGHT
          time: ${page_transition_time}
      - script.execute: update_pager_dots

  - id: activity_timeout_reached
    then:
      - if:
          condition:
            and:
              - lambda: |-
                  return id(turn_off_screen_after_value) != 0;
              - not:
                  lvgl.is_paused
          then:
            - logger.log: "LVGL pausing - enabling snow for burn-in prevention"
            - light.turn_off: indicator_display_backlight
            - delay: 200ms
            - lvgl.pause:
                show_snow: true

  - id: activity_detected
    then:
      if:
        condition: lvgl.is_paused
        then:
          - logger.log: "User interacted - LVGL resuming"
          - lvgl.resume:
          - lvgl.widget.redraw:
          - delay: 200ms
          - light.turn_on: indicator_display_backlight
