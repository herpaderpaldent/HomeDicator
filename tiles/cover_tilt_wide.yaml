# Cover position and tilt tile (wide): two sliders plus open / stop / close. vars: page_id, entity (without "cover."), title, icon, color
sensor:
  - !include
      file: ../core/templates/cover_sensor.yaml
      vars: {attribute: current_position, suffix: ""}
  - !include
      file: ../core/templates/cover_sensor.yaml
      vars: {attribute: current_tilt_position, suffix: "__tilt"}

lvgl:
  pages:
    - id: !extend ${page_id}
      widgets:
        - obj:
            id: !extend ${page_id}_grid
            widgets:
              - !include ../user_interface/templates/tiles/cover/tilt_wide.yaml
