if:
  condition:
    lambda: |-
      return id(user_is_interacting);
  then:
    - lvgl.label.update:
        id: lvgl_value_label_${page_id}__${entity}
        text: !lambda |-
          char buffer[10];
          snprintf(buffer, sizeof(buffer), "%.0f", x);
          return buffer;
    - homeassistant.action:
        action: climate.set_temperature
        data:
          entity_id: climate.${entity}
          temperature: !lambda |-
            return static_cast<int>(x);
